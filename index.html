<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LogoBoard — Кабінет логопеда</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig={
  apiKey: "AIzaSyCIrnjv7UuBiqiH47CEOuQnazf_-3459tU",
  authDomain: "logoboard-pro.firebaseapp.com",
  projectId: "logoboard-pro",
  storageBucket: "logoboard-pro.firebasestorage.app",
  messagingSenderId: "233357793616",
  appId: "1:233357793616:web:002e240de2f598c546f455"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
let _uid=null,_saveTimer=null;

function fbDoc(name){return doc(db,'users',_uid,'data',name);}
async function fbLoad(){
  try{
    const[sSnap,lSnap]=await Promise.all([getDoc(fbDoc('students')),getDoc(fbDoc('lessons'))]);
    if(sSnap.exists()){window._tb.students=sSnap.data().v||[];}
    if(lSnap.exists()){window._tb.lessons=lSnap.data().v||[];}
    window._tb.afterLoad();
  }catch(e){console.error(e);}
}
function fbSave(students,lessons){
  if(!_uid)return;
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(async()=>{
    try{
      await Promise.all([setDoc(fbDoc('students'),{v:students}),setDoc(fbDoc('lessons'),{v:lessons})]);
    }catch(e){console.error(e);}
  },600);
}
onAuthStateChanged(auth,user=>{
  _uid=user?user.uid:null;
  const av=document.getElementById('auth-av');
  if(user){
    if(av){
      av.innerHTML=user.photoURL?`<img src="${user.photoURL}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:(user.displayName||'?')[0].toUpperCase();
      av.style.background='var(--ac)'; av.title=user.displayName||''; av.dataset.auth='out';
    }
    fbLoad();
  }else{
    if(av){av.innerHTML='👤';av.style.background='var(--surf3)';av.title='Увійти';av.dataset.auth='in';}
    window._tb?.afterLoad();
  }
});
window._fbAuth={
  login:()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>console.error(e)),
  logout:()=>signOut(auth),
  save:fbSave
};
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f6f7f9;--surf:#fff;--surf2:#f2f4f7;--surf3:#e9ecf1;--line:#e6e8ee;--tx:#0f172a;--tx2:#666e7d;--tx3:#98a0af;--ac:#4f46e5;--acs:#eef0ff;--ok:#059669;--oks:#e9f7f1;--da:#dc2626;--das:#fdecec;--r:20px;--r2:14px;--r3:11px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:18px 20px 60px;font-size:14px;display:flex;flex-direction:column}
.wrap{max-width:1060px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#auth-av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;background:var(--surf3);border:1px solid var(--line);flex-shrink:0}
.top-brand{display:flex;align-items:center;gap:8px}
.mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--ac);color:#fff;font-weight:600}
.brand h1{font-size:16px;font-weight:600}
.brand p{color:var(--tx2);font-size:11.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 16px;border-radius:var(--r3);font-weight:500;font-size:13.5px;background:var(--ac);color:#fff}
.btn-soft{background:var(--surf);color:var(--tx);border:1px solid var(--line)}
.btn-da{background:var(--da);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn-block{width:100%}
.tabbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:0;z-index:90;padding:12px 0;background:var(--bg)}
.tabs{display:inline-flex;gap:3px;padding:4px;background:var(--surf);border:1px solid var(--line);border-radius:13px}
.tab{padding:7px 17px;border-radius:9px;font-weight:500;font-size:13px;color:var(--tx2)}
.tab.on{color:var(--ac);background:var(--acs)}
.cal-switch{display:flex;gap:3px;padding:4px;background:var(--surf);border:1px solid var(--line);border-radius:13px;margin-left:auto}
.cal-seg{padding:7px 17px;border-radius:9px;font-weight:500;font-size:13px;color:var(--tx2)}
.cal-seg.on{background:var(--acs);color:var(--ac)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-h{display:flex;align-items:center;gap:4px;margin-bottom:10px}
.card-h h2{font-size:15px;font-weight:600}
.card-h .sub{font-size:12px;color:var(--tx3);margin-left:auto}
.view{display:none}
.view.on{display:block}
.sched{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cal-nav{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.cal-nav .m{flex:1;text-align:center;font-weight:600}
.arw{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--tx2)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;text-align:center;font-size:10px;color:var(--tx3);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.day{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:13px}
.day:hover{background:var(--surf2)}
.day.pad{opacity:.3;pointer-events:none}
.day.has{background:var(--acs);color:var(--ac);font-weight:600}
.day.today{box-shadow:inset 0 0 0 1.5px var(--ac)}
.day.sel{background:var(--ac);color:#fff;font-weight:600}
.cal-month{position:relative}
.cal-add{position:absolute;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;background:#1a73e8;color:#fff;border:none;display:grid;place-items:center;z-index:3}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week-col{background:var(--surf2);border-radius:10px;padding:8px;min-height:260px}
.week-col h3{font-size:11px;font-weight:600;margin-bottom:6px;text-align:center;color:var(--tx2)}
.list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.lsn{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:11px;background:var(--surf2)}
.lsn .t{font-size:12px;font-weight:500;color:var(--tx2);min-width:38px}
.lsn .b{flex:1;min-width:0}
.lsn .b strong{display:block;font-size:13px;font-weight:500}
.lsn .b em{font-style:normal;font-size:11px;color:var(--tx3)}
.chip{font-size:10.5px;padding:4px 9px;border-radius:20px}
.chip-ok{background:var(--oks);color:var(--ok)}
.chip-n{background:var(--surf3);color:var(--tx2)}
.x{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--tx3)}
.x:hover{background:var(--das);color:var(--da)}
.s-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.s-card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r2);padding:16px;text-align:left;width:100%}
.s-top{display:flex;align-items:center;gap:8px}
.s-top .nm{flex:1}
.s-top .nm b{display:block;font-size:14px}
.s-top .nm span{font-size:12px;color:var(--tx2)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;flex-shrink:0}
.av-sm{width:31px;height:31px;font-size:11px}
.av-lg{width:54px;height:54px;font-size:19px}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:12px;font-weight:500;color:var(--tx2);margin-bottom:4px}
.inp{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:10px 13px;outline:none}
textarea.inp{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ov{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:470px;background:var(--surf);border-radius:20px;padding:20px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:var(--r2);padding:14px;text-align:left;display:block;width:100%}
.stat b{display:block;font-size:22px;font-weight:600}
.stat span{font-size:11.5px;color:var(--tx2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabbar">
    <div class="top-brand">
      <div class="mark">Л</div>
      <div class="brand"><h1>LogoBoard</h1><p>Кабінет логопеда</p></div>
    </div>
    <div style="margin-left:10px"><span id="auth-av" title="Увійти">👤</span></div>
    <div class="tabs">
      <button class="tab" data-tab="students">Клієнти</button>
      <button class="tab on" data-tab="schedule">Розклад</button>
      <button class="tab" data-tab="payments">Оплати</button>
    </div>
    <div class="cal-switch">
      <button class="cal-seg on" id="view-month">Місяць</button>
      <button class="cal-seg" id="view-week">Тиждень</button>
    </div>
  </div>

  <section class="view" id="v-students">
    <div class="card">
      <div class="card-h"><h2>Клієнти</h2><button class="btn btn-sm" style="margin-left:auto" data-open="student">＋ Додати клієнта</button></div>
      <div class="s-grid" id="s-grid"></div>
    </div>
  </section>

  <section class="view on" id="v-schedule">
    <div class="sched" id="sched" style="grid-template-columns:1fr">
      <div class="card cal-month" id="month-card">
        <div class="card-h"><h2>Календар</h2><span class="sub" id="cal-count"></span></div>
        <div class="cal-nav">
          <button class="arw" id="prev">‹</button>
          <span class="m" id="cal-m"></span>
          <button class="arw" id="next">›</button>
        </div>
        <div class="dow"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Нд</div></div>
        <div class="grid" id="grid"></div>
        <button class="cal-add" data-open="lesson">＋</button>
      </div>

      <div class="card" id="week-card" style="display:none">
        <div class="card-h"><h2>Розклад на тиждень</h2></div>
        <div class="week-grid" id="week-grid"></div>
      </div>

      <div class="card" style="margin-top:14px">
        <div class="card-h"><h2 id="day-t">Заняття</h2><span class="sub" id="day-s"></span></div>
        <div class="list" id="day-list"></div>
        <button class="btn btn-soft btn-block btn-sm" data-open="lesson" style="margin-top:14px">＋ Додати заняття на цей день</button>
      </div>
    </div>
  </section>

  <section class="view" id="v-payments">
    <div class="card">
      <div class="card-h"><h2>Оплати та борги</h2></div>
      <div id="pay-list"></div>
    </div>
  </section>

  <section class="stats" id="stats"></section>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet-in"></div></div>

<script>
'use strict';
const PALETTE=['#4f46e5','#e11d48','#0d9488','#d97706','#7c3aed','#0284c7','#db2777','#16a34a'];
const MONTHS=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const WD=['неділя','понеділок','вівторок','середа','четвер','п’ятниця','субота'];

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY=iso(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const money=n=>n.toLocaleString('uk-UA')+' грн';
const fmtDate=s=>{const[y,m,d]=s.split('-').map(Number);return `${d} ${MONTHS[m-1]}`;};

const load=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:f;}catch{return f;}};
let students=load('tb_students',[]);
let lessons=load('tb_lessons',[]);

function save(){
  try{
    localStorage.setItem('tb_students',JSON.stringify(students));
    localStorage.setItem('tb_lessons',JSON.stringify(lessons));
  }catch{}
  window._fbAuth?.save(students,lessons);
}

window._tb={
  students,lessons,
  afterLoad(){
    students=window._tb.students; lessons=window._tb.lessons;
    save(); render();
  }
};

let tab='schedule';
let calMode='month';
let cursor=new Date();
let picked=TODAY;

const getS=id=>students.find(s=>s.id===id);
const onDay=d=>lessons.filter(l=>l.date===d).sort((a,b)=>a.time.localeCompare(b.time));
const initials=n=>n.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?';
const avatar=(s,cls='')=>`<span class="av ${cls}" style="background:${s.color}">${esc(initials(s.name))}</span>`;

function renderStats(){
  const mo=TODAY.slice(0,7);
  const earned=lessons.filter(l=>l.date.startsWith(mo)&&l.paid).reduce((a,l)=>a+(getS(l.studentId)?.price||0),0);
  $('#stats').innerHTML=`
    <button class="stat" data-goto="students"><b>${students.length}</b><span>Активних клієнтів</span></button>
    <button class="stat" data-goto="payments"><b>${money(earned)}</b><span>Отримано за місяць</span></button>`;
}

function renderStudents(){
  const el=$('#s-grid');
  if(!students.length){el.innerHTML=`<div style="grid-column:1/-1;text-align:center;color:var(--tx3);padding:30px">Ще немає клієнтів</div>`;return;}
  el.innerHTML=students.map(s=>`
    <button class="s-card" data-student="${s.id}">
      <div class="s-top">${avatar(s)}<span class="nm"><b>${esc(s.name)}</b><span>Логопедія · ${money(s.price||0)}</span></span></div>
    </button>`).join('');
}

function renderCalendar(){
  const y=cursor.getFullYear(),m=cursor.getMonth();
  $('#cal-m').textContent=new Date(y,m).toLocaleDateString('uk-UA',{month:'long',year:'numeric'});
  const mo=`${y}-${String(m+1).padStart(2,'0')}`;
  const first=new Date(y,m,1).getDay(),pad=first===0?6:first-1;
  const days=new Date(y,m+1,0).getDate();
  let h='';
  for(let i=0;i<pad;i++)h+='<div class="day pad"></div>';
  for(let d=1;d<=days;d++){
    const ds=`${mo}-${String(d).padStart(2,'0')}`;
    const cnt=lessons.filter(l=>l.date===ds).length;
    const cls=['day',cnt&&'has',ds===TODAY&&'today',ds===picked&&'sel'].filter(Boolean).join(' ');
    h+=`<button class="${cls}" data-date="${ds}">${d}</button>`;
  }
  $('#grid').innerHTML=h;
}

function renderWeek(){
  const curr=new Date(picked);
  const firstDayOfWeek=curr.getDate()-curr.getDay()+1;
  let h='';
  for(let i=0;i<7;i++){
    const dayDate=new Date(curr.setDate(firstDayOfWeek+i));
    const ds=iso(dayDate);
    const dayLessons=onDay(ds);
    const isToday=ds===TODAY;
    const isSel=ds===picked;
    h+=`<div class="week-col" style="${isSel?'border:2px solid var(--ac)':''};background:${isToday?'var(--acs)':'var(--surf2)'}" data-date="${ds}">
      <h3>${['Пн','Вт','Ср','Чт','Пт','Сб','Нд'][i]}<br>${dayDate.getDate()}</h3>
      <div style="display:flex;flex-direction:column;gap:4px">
        ${dayLessons.map(l=>{const s=getS(l.studentId);return `<div style="background:var(--surf);padding:6px;border-radius:8px;font-size:11px"><b>${esc(l.time)}</b> ${esc(s?.name||'')}</div>`;}).join('')}
      </div>
    </div>`;
  }
  $('#week-grid').innerHTML=h;
}

function renderDay(){
  const items=onDay(picked);
  $('#day-t').textContent=picked===TODAY?'Сьогодні':fmtDate(picked);
  $('#day-s').textContent=WD[new Date(picked+'T00:00:00').getDay()];
  const el=$('#day-list');
  if(!items.length){el.innerHTML=`<div style="text-align:center;color:var(--tx3);padding:20px">Немає занять</div>`;return;}
  el.innerHTML=items.map(l=>{
    const s=getS(l.studentId); if(!s)return '';
    return `<div class="lsn">
      <span class="t">${esc(l.time)}</span>
      ${avatar(s,'av-sm')}
      <span class="b"><strong>${esc(s.name)}</strong><em>${esc(l.topic||'Заняття')}</em></span>
      <button class="chip ${l.paid?'chip-ok':'chip-n'}" data-toggle="${l.id}">${l.paid?'Оплачено':'Не оплачено'}</button>
      <button class="x" data-del="${l.id}">×</button>
    </div>`;
  }).join('');
}

function renderPayments(){
  const el=$('#pay-list');
  const unpaid=lessons.filter(l=>!l.paid);
  if(!unpaid.length){el.innerHTML=`<div style="text-align:center;color:var(--tx3);padding:30px">Усі заняття оплачено</div>`;return;}
  el.innerHTML=unpaid.map(l=>{
    const s=getS(l.studentId); if(!s)return '';
    return `<div class="lsn">
      <span class="t">${esc(l.date)}</span>
      <span class="b"><strong>${esc(s.name)}</strong><em>${money(s.price||0)}</em></span>
      <button class="btn btn-ok btn-sm" data-pay="${l.id}">Оплачено</button>
    </div>`;
  }).join('');
}

function render(){
  renderStats();
  if(tab==='students')renderStudents();
  if(tab==='schedule'){
    if(calMode==='month'){
      $('#month-card').style.display='block';
      $('#week-card').style.display='none';
      renderCalendar();
    }else{
      $('#month-card').style.display='none';
      $('#week-card').style.display='block';
      renderWeek();
    }
    renderDay();
  }
  if(tab==='payments')renderPayments();
}

function switchTab(name){
  tab=name;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  $('#v-'+name).classList.add('on');
  render();
}

function openSheet(html){$('#sheet-in').innerHTML=html;$('#ov').classList.add('on');}
function closeSheet(){$('#ov').classList.remove('on');}

function studentForm(id){
  const s=id?getS(id):null;
  openSheet(`
    <div class="card-h"><h2>${s?'Редагувати клієнта':'Новий клієнт'}</h2><button class="x" data-close>×</button></div>
    <label class="field"><span>Ім'я *</span><input class="inp" id="f-name" value="${esc(s?.name||'')}"></label>
    <label class="field"><span>Ціна заняття, грн</span><input class="inp" id="f-price" type="number" value="${s?.price??350}"></label>
    <label class="field"><span>Примітки</span><textarea class="inp" id="f-notes">${esc(s?.notes||'')}</textarea></label>
    <button class="btn btn-block" id="f-save">Зберегти</button>`);
  $('#f-save').onclick=()=>{
    const name=$('#f-name').value.trim(); if(!name)return alert("Вкажіть ім'я");
    const data={name, price:Number($('#f-price').value)||0, notes:$('#f-notes').value.trim()};
    if(s)Object.assign(s,data);
    else students.push({id:Date.now(),...data,color:PALETTE[students.length%PALETTE.length]});
    save(); closeSheet(); render();
  };
}

function studentSheet(id){
  const s=getS(id); if(!s)return;
  openSheet(`
    <div class="card-h">${avatar(s,'av-lg')}<div style="margin-left:10px"><h2>${esc(s.name)}</h2><span>${money(s.price||0)}</span></div><button class="x" data-close>×</button></div>
    <div style="font-size:13px;color:var(--tx2);margin:14px 0">${esc(s.notes||'Немає нотаток')}</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-soft btn-sm" id="d-edit" style="flex:1">Редагувати</button>
      <button class="btn btn-da btn-sm" id="d-del" style="flex:1">Видалити</button>
    </div>`);
  $('#d-edit').onclick=()=>studentForm(id);
  $('#d-del').onclick=()=>{
    if(confirm('Видалити клієнта?')){
      students=students.filter(x=>x.id!==id);
      lessons=lessons.filter(l=>l.studentId!==id);
      save(); closeSheet(); render();
    }
  };
}

function lessonForm(){
  if(!students.length)return studentForm();
  openSheet(`
    <div class="card-h"><h2>Нове заняття</h2><button class="x" data-close>×</button></div>
    <label class="field"><span>Клієнт</span><select class="inp" id="l-s">${students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label>
    <div class="row2">
      <label class="field"><span>Дата</span><input class="inp" id="l-d" type="date" value="${picked}"></label>
      <label class="field"><span>Час</span><input class="inp" id="l-t" type="time" value="15:00"></label>
    </div>
    <label class="field"><span>Тема</span><input class="inp" id="l-top" placeholder="Постановка звука"></label>
    <button class="btn btn-block" id="l-save">Додати</button>`);
  $('#l-save').onclick=()=>{
    const d=$('#l-d').value;
    const t=$('#l-t').value;
    const sid=Number($('#l-s').value);
    
    // Суворе блокування дублювання часу для будь-кого
    const timeConflict=lessons.find(l=>l.date===d&&l.time===t);
    if(timeConflict){
      alert(`Увага! На цей час (${t}) вже записаний інший клієнт. Виберіть вільну годину.`);
      return;
    }

    lessons.push({id:Date.now(), studentId:sid, date:d, time:t, topic:$('#l-top').value.trim(), paid:false});
    save(); closeSheet(); render();
  };
}

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('.tab'))return switchTab(t.closest('.tab').dataset.tab);
  if(t.closest('[data-goto]'))return switchTab(t.closest('[data-goto]').dataset.goto);
  if(t.closest('.day[data-date]')){picked=t.closest('.day[data-date]').dataset.date;renderDay();if(calMode==='month')renderCalendar();}
  if(t.closest('.week-col[data-date]')){picked=t.closest('.week-col[data-date]').dataset.date;renderDay();renderWeek();}
  if(t.closest('[data-open]'))return t.closest('[data-open]').dataset.open==='student'?studentForm():lessonForm();
  if(t.closest('[data-toggle]')){const l=lessons.find(x=>x.id==t.dataset.toggle);if(l){l.paid=!l.paid;save();render();}}
  if(t.closest('[data-pay]')){const l=lessons.find(x=>x.id==t.dataset.pay);if(l){l.paid=true;save();render();}}
  if(t.closest('[data-del]')){const id=Number(t.dataset.del);lessons=lessons.filter(x=>x.id!==id);save();render();}
  if(t.closest('.s-card'))return studentSheet(Number(t.closest('.s-card').dataset.student));
  if(t.closest('#auth-av')){
    const authAv=t.closest('#auth-av');
    if(authAv.dataset.auth==='out')window._fbAuth?.logout();
    else window._fbAuth?.login();
  }
  if(t.closest('[data-close]')||t.classList.contains('ov'))closeSheet();
});

$('#view-month').onclick=()=>{calMode='month';$('#view-month').classList.add('on');$('#view-week').classList.remove('on');render();};
$('#view-week').onclick=()=>{calMode='week';$('#view-week').classList.add('on');$('#view-month').classList.remove('on');render();};

$('#prev').onclick=()=>{if(calMode==='month'){cursor.setMonth(cursor.getMonth()-1);renderCalendar();}else{const d=new Date(picked);d.setDate(d.getDate()-7);picked=iso(d);renderWeek();renderDay();}};
$('#next').onclick=()=>{if(calMode==='month'){cursor.setMonth(cursor.getMonth()+1);renderCalendar();}else{const d=new Date(picked);d.setDate(d.getDate()+7);picked=iso(d);renderWeek();renderDay();}};

switchTab('schedule');
</script>
</body>
</html>
